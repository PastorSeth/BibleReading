<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — The Plan Sheet, e-ink</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E7E7E2; --ink: #1E1F1F; --ink-2: #474A49; --rule: #B5B6B0; --faint: #CFD0CA;
    --nt: #3F6E6C; --ot: #95533F; --wis: #85703A;
    --face: 'Atkinson Hyperlegible', 'Avenir Next', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: var(--ink); color: var(--paper); }
  body { background: var(--paper); color: var(--ink); font-family: var(--face); -webkit-font-smoothing: antialiased; }
  .app { max-width: 430px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
  header { padding: 16px 20px 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--ink-2); }
  .sync { display: inline-flex; align-items: center; gap: 6px; }
  .sync svg { width: 14px; height: 14px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin-top: 22px; line-height: 1.1; }
  .seq { font-size: 16px; color: var(--ink-2); margin-top: 4px; }
  main { flex: 1; padding: 0 20px 24px; }
  ul { list-style: none; padding: 0; margin-top: 18px; border-top: 2px solid var(--ink); }
  li { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .nt { --c: var(--nt); } .ot { --c: var(--ot); } .wis { --c: var(--wis); }

  /* The tick box. Ticking plays a tiny e-ink partial refresh: invert to ink, then settle. */
  .tick { all: unset; flex: none; width: 36px; height: 36px; border: 2.5px solid var(--ink); display: grid; place-items: center; cursor: pointer; position: relative; }
  .tick:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .tick svg { width: 24px; height: 24px; fill: none; stroke: var(--paper); stroke-width: 3; stroke-linecap: square; stroke-dasharray: 24; stroke-dashoffset: 24; }
  .tick[aria-pressed="true"] { background: var(--c); border-color: var(--c); }
  .tick[aria-pressed="true"] svg { stroke-dashoffset: 0; }
  .tick.refresh { animation: refresh 260ms steps(1, end); }
  .tick.refresh[aria-pressed="true"] svg { animation: draw 200ms 90ms steps(4, end) both; }
  @keyframes refresh { 0% { background: var(--ink); border-color: var(--ink); } 45% { background: var(--paper); border-color: var(--ink); } }
  @keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .tick.refresh, .tick.refresh svg { animation: none !important; } }

  .what { flex: 1; min-width: 0; }
  .ref { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .track { font-size: 14px; color: var(--ink-2); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .track a { color: var(--ink-2); display: inline-flex; padding: 4px; margin: -4px; }
  .track svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .partner { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .dither { width: 14px; height: 14px; background: repeating-conic-gradient(var(--c) 0 25%, transparent 0 50%) 0 0 / 4px 4px; outline: 1px solid var(--c); }

  h2 { font-size: 17px; font-weight: 700; margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: 88px repeat(5, 1fr); gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .grid .day { text-align: center; }
  .grid .day.now { color: var(--ink); font-weight: 700; }
  .cell { height: 28px; border: 1.5px solid var(--faint); display: grid; grid-template-columns: 1fr 1fr; }
  .cell.now { border-color: var(--ink); }
  .cell .me.on { background: var(--c); }
  .cell .her.on { background: repeating-conic-gradient(var(--c) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
  .key { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 12px; height: 12px; background: var(--ink-2); }
  .key i.d { background: repeating-conic-gradient(var(--ink-2) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
  .catch { margin-top: 18px; font-size: 15px; }
  .catch a { color: var(--ink); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

  nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); padding: 8px 0 24px; position: sticky; bottom: 0; background: var(--paper); }
  nav a { display: grid; justify-items: center; gap: 3px; font-size: 12px; color: var(--ink-2); text-decoration: none; padding-top: 2px; }
  nav a.on { color: var(--ink); font-weight: 700; }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="bar"><span>Bible Reading 2027</span><span class="sync"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5"/></svg>Not synced yet</span></div>
    <h1>Monday, January 4</h1>
    <p class="seq">Week 1, day 1</p>
  </header>
  <main>
    <ul>
      <li class="nt">
        <button class="tick" aria-pressed="true" aria-label="Mark Luke 1 read" data-cell="nt"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <div class="what"><div class="ref">Luke 1</div><div class="track">New Testament <a href="#" aria-label="Read Luke 1 online"><svg viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/></svg></a></div></div>
        <span class="partner"><i class="dither"></i>Anna</span>
      </li>
      <li class="ot">
        <button class="tick" aria-pressed="false" aria-label="Mark Genesis 1 read" data-cell="ot"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <div class="what"><div class="ref">Genesis 1</div><div class="track">Old Testament <a href="#" aria-label="Read Genesis 1 online"><svg viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/></svg></a></div></div>
        <span class="partner"><i class="dither"></i>Anna</span>
      </li>
      <li class="wis">
        <button class="tick" aria-pressed="false" aria-label="Mark Psalm 1 read" data-cell="wis"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <div class="what"><div class="ref">Psalm 1</div><div class="track">Psalm <a href="#" aria-label="Read Psalm 1 online"><svg viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/></svg></a></div></div>
      </li>
    </ul>

    <h2>This week</h2>
    <div class="grid">
      <span></span><span class="day now">Mon</span><span class="day">Tue</span><span class="day">Wed</span><span class="day">Thu</span><span class="day">Fri</span>
      <span class="nt">New Test.</span><span class="cell now nt" id="cell-nt"><i class="me on"></i><i class="her on"></i></span><span class="cell nt"><i class="me"></i><i class="her"></i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="ot">Old Test.</span><span class="cell now ot" id="cell-ot"><i class="me"></i><i class="her on"></i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="wis">Psalm/Prov.</span><span class="cell now wis" id="cell-wis"><i class="me"></i><i class="her"></i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
    </div>
    <div class="key"><span><i></i>You</span><span><i class="d"></i>Anna</span></div>
    <p class="catch"><a href="#">3 readings to catch up</a></p>
  </main>
  <nav>
    <a class="on" href="#"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Week</a>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>Plan</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>Account</a>
  </nav>
</div>
<script>
  document.querySelectorAll('.tick').forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.classList.remove('refresh'); void b.offsetWidth; b.classList.add('refresh');
    b.setAttribute('aria-pressed', on);
    document.querySelector(`#cell-${b.dataset.cell} .me`).classList.toggle('on', on);
  }));
</script>
</body>
</html>
